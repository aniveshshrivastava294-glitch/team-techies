## render.yaml — Render Blueprint for CampusOrbit
## Deploys:
##   1. campus-orbit-api   → Web Service  (Node/Express backend, /backend)
##   2. campus-orbit-ui    → Static Site  (Vite/React frontend, /frontend)

services:
  # ─────────────────────────────────────────────────────────────
  # 1. BACKEND — Express Web Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: campus-orbit-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/kpis
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Set these in the Render dashboard (Secret values) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 2. FRONTEND — Vite/React Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: campus-orbit-ui
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the frontend at the backend — replace with your actual
      # Render service URL after first deploy, e.g.:
      # https://campus-orbit-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
